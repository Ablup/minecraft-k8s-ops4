apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  # single-replica stateful app, uses 'Recreate' 
  # ensures the old pod releases the PVC before the new one starts.
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      # pull from private ECR repo
      imagePullSecrets:
        - name: regcred 
      containers:
      - name: minecraft
        image: 654654227412.dkr.ecr.us-east-1.amazonaws.com/minecraft-repo:v1.0.8
        ports:
        - containerPort: 25565
          name: mc-port
        env:
        - name: EULA
          value: "TRUE"
        - name: MOTD
          value: "Abram Gallup - Ops 4 Server"
        - name: VERSION
          value: "1.20.1" #same as Ops 3 version
        - name: MEMORY
          value: "1G"
        
        # Resource controls
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"

        # slow Java world-loading process
        startupProbe:
          tcpSocket:
            port: 25565
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30 # Gives the server up to 5 minutes to start

        # monitors if the server crashes after it's up
        livenessProbe:
          tcpSocket:
            port: 25565
          periodSeconds: 20

        volumeMounts:
        - name: minecraft-data
          mountPath: /data
      
      volumes:
      - name: minecraft-data
        persistentVolumeClaim:
          claimName: minecraft-pvc
